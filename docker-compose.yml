services:
  openldap:
    build:
      context: .
      dockerfile: openldap/Dockerfile
    image: openldap-fail2ban:1.0
    container_name: openldap
    hostname: ldap.example.com
    environment:
      LDAP_ORGANISATION: "Example Corp"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "adminpassword"
    ports:
      - "389:389"
      - "636:636"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks:
      - ldap-network


  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin
    hostname: phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      # The image enables HTTPS by default. For this lab we intentionally
      # disable it so Apache serves phpLDAPadmin correctly on port 80.
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8081:80"
    depends_on:
      - openldap
    networks:
      - ldap-network

  api:
    build: ./fastapi
    container_name: ldap-api
    ports:
      - "8000:8000"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      LDAP_HOST: openldap
      LDAP_PORT: "389"
      LDAP_BASE_DN: "dc=example,dc=com"
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - openldap
    networks:
      - ldap-network

volumes:
  ldap_data:
  ldap_config:

networks:
  ldap-network:
